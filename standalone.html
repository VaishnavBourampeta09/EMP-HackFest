<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>GuardianRoute</title>
<style>
:root {
  --bg: #f1f5f9;
  --surface: #ffffff;
  --ink: #0f172a;
  --muted: #64748b;
  --line: #e2e8f0;
  --brand: #2563eb;
  --low: #16a34a;
  --medium: #d97706;
  --high: #dc2626;
  color-scheme: light;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Inter", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--surface);
  display: flex;
  flex-direction: column;
  box-shadow: 0 0 60px rgba(15, 23, 42, 0.08);
}

.app-bar {
  position: sticky;
  top: 0;
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 16px;
  background: #0f172a;
  color: #f8fafc;
}

.brand { display: flex; align-items: center; gap: 10px; }

.brand-mark {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 12px;
  background: var(--brand);
  font-weight: 700;
  font-size: 13px;
}

.brand strong { display: block; font-size: 15px; }

.tagline { font-size: 10px; color: #94a3b8; }

.mode-toggle { display: flex; background: rgba(255, 255, 255, 0.12); border-radius: 999px; padding: 3px; }

.mode-toggle button {
  position: relative;
  border: 0;
  background: transparent;
  color: #cbd5f5;
  font-size: 12px;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 999px;
  cursor: pointer;
}

.mode-toggle button.active { background: #f8fafc; color: #0f172a; }

.dot {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--high);
}

main { flex: 1; }

.screen { padding: 16px 16px 32px; display: flex; flex-direction: column; gap: 14px; }

h1 { font-size: 22px; margin: 4px 0 0; }
h2 { font-size: 18px; margin: 2px 0; }
h3 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 4px 0; }

p { margin: 0; font-size: 14px; line-height: 1.45; }

.muted { color: var(--muted); font-size: 13px; }
.footnote { color: var(--muted); font-size: 11px; }

.input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--line);
  font-size: 15px;
  background: #f8fafc;
}

.quick-picks { display: flex; flex-wrap: wrap; gap: 8px; }

.chip {
  border: 1px solid var(--line);
  background: #f8fafc;
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.chip:hover { border-color: var(--brand); color: var(--brand); }

.map-shell { border-radius: 16px; overflow: hidden; border: 1px solid var(--line); }
.map { width: 100%; height: 100%; }

.route-list { display: flex; flex-direction: column; gap: 10px; }

.route-card {
  text-align: left;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 16px;
  padding: 14px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 8px;
  font: inherit;
  color: inherit;
}

.route-card.selected { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }

.route-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.route-label { display: block; font-size: 16px; font-weight: 700; }
.route-summary { font-size: 12px; color: var(--muted); }
.route-metrics { display: flex; gap: 12px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.reasons { margin: 0; padding-left: 16px; font-size: 12.5px; color: #334155; }
.reasons li { margin: 2px 0; }
.explanation { font-size: 12.5px; color: var(--muted); font-style: italic; }

.pill { padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.pill-low { background: #dcfce7; color: var(--low); }
.pill-medium { background: #fef3c7; color: var(--medium); }
.pill-high { background: #fee2e2; color: var(--high); }

.status-banner {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  padding: 14px;
  border-radius: 16px;
  background: #eff6ff;
  border: 1px solid #bfdbfe;
}

.status-banner.banner-alert { background: #fef2f2; border-color: #fecaca; }
.kicker { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }

.live-dot { font-size: 11px; font-weight: 600; color: var(--brand); white-space: nowrap; }

.trip-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.trip-stats div { background: #f8fafc; border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.trip-stats span { display: block; font-size: 11px; color: var(--muted); }
.trip-stats strong { font-size: 16px; font-variant-numeric: tabular-nums; }

.action-row { display: flex; flex-wrap: wrap; gap: 8px; }

.btn {
  border: 1px solid transparent;
  border-radius: 12px;
  padding: 11px 14px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: inherit;
}

.btn-primary { background: var(--brand); color: #fff; }
.btn-primary:disabled { background: #cbd5e1; cursor: not-allowed; }
.btn-ghost { background: #f1f5f9; color: var(--ink); border-color: var(--line); }
.btn-danger { background: #dc2626; color: #fff; }
.btn-quiet { background: transparent; color: var(--muted); border-color: var(--line); font-size: 12px; padding: 7px 10px; }
.btn-block { width: 100%; }

.link-back { border: 0; background: transparent; color: var(--brand); font-size: 13px; font-weight: 600; padding: 0; cursor: pointer; text-align: left; }

.sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.55);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 1000;
}

.sheet {
  width: 100%;
  max-width: 480px;
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  padding: 20px 18px 26px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.sheet-kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--high); }
.sheet-reason { color: var(--muted); font-size: 13px; }
.countdown { font-size: 13px; color: var(--ink); }
.sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }

.alert-card {
  border: 1px solid var(--line);
  border-left: 4px solid var(--medium);
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: #fff;
}

.alert-card.severity-high { border-left-color: var(--high); background: #fff7f7; }
.alert-card.severity-low { border-left-color: var(--brand); }
.alert-head { display: flex; justify-content: space-between; align-items: center; }
.alert-title { font-weight: 700; font-size: 15px; }
.alert-time { font-size: 12px; color: var(--muted); }
.alert-message { font-size: 13.5px; }
.alert-meta { font-size: 12px; color: var(--muted); }
.alert-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.alert-actions .btn { flex: 1; font-size: 13px; padding: 9px 10px; }
.status-chip { align-self: flex-start; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }

.empty-state { padding: 18px; border-radius: 16px; background: #f8fafc; border: 1px dashed var(--line); color: var(--muted); }

.settings-list { display: flex; flex-direction: column; gap: 8px; }
.setting-row { display: flex; align-items: center; gap: 10px; font-size: 13.5px; background: #f8fafc; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.setting-row input { width: 16px; height: 16px; accent-color: var(--brand); }

.privacy { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 16px; padding: 14px; }
.privacy p { font-size: 12.5px; color: #166534; }

.demo-bar {
  position: sticky;
  bottom: 0;
  background: #0f172a;
  color: #e2e8f0;
  padding: 10px 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.demo-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #94a3b8; }
.demo-buttons { display: flex; gap: 8px; flex-wrap: wrap; }

.demo-buttons button {
  flex: 1;
  min-width: 110px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  background: rgba(255, 255, 255, 0.08);
  color: #e2e8f0;
  border-radius: 10px;
  padding: 9px 10px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}

.demo-buttons button:disabled { opacity: 0.4; cursor: not-allowed; }

.leaflet-container { font-family: inherit; }

.svg-map { width: 100%; display: block; background: #eef2f7; }
.svg-map .street { stroke: #dbe3ee; stroke-width: 1.4; fill: none; }
.svg-map .river { stroke: #cfe3f5; stroke-width: 6; fill: none; stroke-linecap: round; }
.svg-map text { font-size: 7px; fill: #64748b; font-family: inherit; }
.map-legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: var(--muted); padding-top: 6px; }
.map-legend span { display: inline-flex; align-items: center; gap: 5px; }
.swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.teen-dot { fill: #2563eb; stroke: #fff; stroke-width: 2.5; }
.route-line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.trail-line { fill: none; stroke: #0f172a; stroke-width: 1.6; stroke-dasharray: 3 4; }

function haversineMeters(a, b) {
  const lat1 = toRadians(a[0]);
  const lat2 = toRadians(b[0]);
  const dLat = toRadians(b[0] - a[0]);
  const dLng = toRadians(b[1] - a[1]);
  const h =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
  return 2 * EARTH_RADIUS_METERS * Math.asin(Math.min(1, Math.sqrt(h)));
}

function distanceToSegmentMeters(point, start, end) {
  const scale = Math.cos(toRadians(point[0]));
  const px = point[1] * scale;
  const py = point[0];
  const ax = start[1] * scale;
  const ay = start[0];
  const bx = end[1] * scale;
  const by = end[0];
  const dx = bx - ax;
  const dy = by - ay;
  const lengthSquared = dx * dx + dy * dy;
  let t = 0;
  if (lengthSquared > 0) {
    t = ((px - ax) * dx + (py - ay) * dy) / lengthSquared;
    t = Math.max(0, Math.min(1, t));
  }
  const closest = [ay + t * dy, (ax + t * dx) / scale];
  return haversineMeters(point, closest);
}

function distanceToPathMeters(point, path) {
  if (!path || path.length === 0) return Infinity;
  if (path.length === 1) return haversineMeters(point, path[0]);
  let best = Infinity;
  for (let i = 0; i < path.length - 1; i += 1) {
    const d = distanceToSegmentMeters(point, path[i], path[i + 1]);
    if (d < best) best = d;
  }
  return best;
}

function interpolatePath(waypoints, stepMeters = 60) {
  const points = [];
  for (let i = 0; i < waypoints.length - 1; i += 1) {
    const start = waypoints[i];
    const end = waypoints[i + 1];
    const segmentLength = haversineMeters(start, end);
    const steps = Math.max(1, Math.round(segmentLength / stepMeters));
    for (let s = 0; s < steps; s += 1) {
      const t = s / steps;
      points.push([
        start[0] + (end[0] - start[0]) * t,
        start[1] + (end[1] - start[1]) * t
      ]);
    }
  }
  points.push(waypoints[waypoints.length - 1]);
  return points;
}

function pathLengthMeters(path) {
  let total = 0;
  for (let i = 0; i < path.length - 1; i += 1) {
    total += haversineMeters(path[i], path[i + 1]);
  }
  return total;
}

function nearestIndex(point, path) {
  let best = 0;
  let bestDistance = Infinity;
  for (let i = 0; i < path.length; i += 1) {
    const d = haversineMeters(point, path[i]);
    if (d < bestDistance) {
      bestDistance = d;
      best = i;
    }
  }
  return best;
}

function detourFrom(point, bearingLngSign = -1) {
  const waypoints = [
    point,
    [point[0] + 0.0006, point[1] + bearingLngSign * 0.0022],
    [point[0] - 0.0004, point[1] + bearingLngSign * 0.0045],
    [point[0] - 0.0016, point[1] + bearingLngSign * 0.0062]
  ];
  return interpolatePath(waypoints, 40);
}


const ZONE_LABELS = {
  property_crime: 'property crime',
  violent_crime: 'violent crime',
  collision: 'high-collision',
  low_light: 'poorly lit',
  user_reported: 'community reported'
};

function getRecencyWeight(recencyDays) {
  if (recencyDays <= 7) return 3;
  if (recencyDays <= 30) return 2;
  if (recencyDays <= 90) return 1;
  return 0.5;
}

function isAfterDark(date = new Date()) {
  const hour = date.getHours();
  return hour >= 19 || hour < 6;
}

function riskLevel(score) {
  if (score <= 20) return 'Low';
  if (score <= 50) return 'Medium';
  return 'High';
}

const PROXIMITY_BAND_METERS = 150;
const CROSSING_WEIGHT = 3;
const PROXIMITY_WEIGHT = 1;
const SCORE_SCALE = 0.45;

function scoreRoute(routePoints, incidentZones, options = {}) {
  const { currentTime = new Date(), safePlaces = [] } = options;
  let raw = 0;
  const crossed = [];
  const near = [];
  const reasons = [];

  for (const zone of incidentZones) {
    const distance = distanceToPathMeters([zone.lat, zone.lng], routePoints);
    const recencyWeight = getRecencyWeight(zone.recencyDays);
    if (distance <= zone.radiusMeters) {
      raw += zone.severity * recencyWeight * CROSSING_WEIGHT;
      crossed.push(zone);
    } else if (distance <= zone.radiusMeters + PROXIMITY_BAND_METERS) {
      raw += zone.severity * recencyWeight * PROXIMITY_WEIGHT;
      near.push(zone);
    }
  }

  let score = raw * SCORE_SCALE;

  let darkPenalty = 0;
  if (isAfterDark(currentTime)) {
    darkPenalty = 10;
    score += darkPenalty;
  }

  let safeBonus = 0;
  for (const place of safePlaces) {
    if (distanceToPathMeters([place.lat, place.lng], routePoints) <= place.radiusMeters) {
      safeBonus += 3;
    }
  }
  score = Math.max(0, score - safeBonus);

  const groupCount = (zones, type) => zones.filter((z) => z.type === type).length;
  for (const type of Object.keys(ZONE_LABELS)) {
    const c = groupCount(crossed, type);
    if (c > 0) {
      reasons.push(`Passes directly through ${c} ${ZONE_LABELS[type]} zone${c > 1 ? 's' : ''}`);
    }
  }
  for (const type of Object.keys(ZONE_LABELS)) {
    const n = groupCount(near, type);
    if (n > 0) {
      reasons.push(`Runs close to ${n} ${ZONE_LABELS[type]} zone${n > 1 ? 's' : ''}`);
    }
  }
  if (darkPenalty > 0) reasons.push('Trip happens after dark');
  if (safeBonus > 0) reasons.push('Passes trusted safe places along the way');
  if (crossed.length === 0 && near.length === 0) {
    reasons.push('Avoids every recent incident zone in the area');
  }

  const rounded = Math.min(Math.round(score), 100);
  return {
    score: rounded,
    level: riskLevel(rounded),
    reasons,
    crossedZones: crossed,
    nearbyZones: near
  };
}

function explainScore(result, label) {
  const level = result.level.toLowerCase();
  const crossed = result.crossedZones.length;
  const near = result.nearbyZones.length;
  if (crossed === 0 && near === 0) {
    return `The ${label} route has ${level} risk because it avoids every mapped incident zone on the way.`;
  }
  const parts = [];
  if (crossed > 0) parts.push(`${crossed} zone${crossed > 1 ? 's' : ''} it passes through`);
  if (near > 0) parts.push(`${near} zone${near > 1 ? 's' : ''} it passes near`);
  return `The ${label} route has ${level} risk because of ${parts.join(' and ')}, weighted by how recent and how severe those reports are.`;
}

function findNearbyIncidentZone(location, incidentZones) {
  let closest = null;
  let closestDistance = Infinity;
  for (const zone of incidentZones) {
    const distance = haversineMeters(location, [zone.lat, zone.lng]);
    if (distance <= zone.radiusMeters && distance < closestDistance) {
      closest = zone;
      closestDistance = distance;
    }
  }
  return closest;
}


function distanceFromRoute(location, routePoints) {
  return distanceToPathMeters(location, routePoints);
}

function isOffRoute(location, routePoints, thresholdMeters = 300) {
  return distanceFromRoute(location, routePoints) > thresholdMeters;
}

function routeProgress(location, routePoints) {
  if (!routePoints || routePoints.length < 2) return 0;
  const index = nearestIndex(location, routePoints);
  const travelled = pathLengthMeters(routePoints.slice(0, index + 1));
  const total = pathLengthMeters(routePoints);
  if (total === 0) return 0;
  return Math.min(1, travelled / total);
}

function remainingMinutes(location, routePoints, durationMinutes) {
  const progress = routeProgress(location, routePoints);
  return Math.max(0, Math.round(durationMinutes * (1 - progress)));
}


const DEFAULT_SETTINGS = {
  offRouteMeters: 300,
  longStopMinutes: 5,
  checkRiskZones: true,
  etaDelayMinutes: 10,
  checkinTimeoutSeconds: 30
};

function evaluateTrip(context) {
  const {
    location,
    routePoints,
    durationMinutes,
    minutesStopped,
    incidentZones,
    settings = DEFAULT_SETTINGS,
    handledKeys = []
  } = context;

  const triggers = [];
  const handled = new Set(handledKeys);

  const offBy = distanceFromRoute(location, routePoints);
  if (offBy > settings.offRouteMeters && !handled.has('route_deviation')) {
    triggers.push({
      key: 'route_deviation',
      type: 'route_deviation',
      severity: 'medium',
      question: 'You left the planned route. Are you okay?',
      message: `Teen is ${Math.round(offBy)}m away from the planned route.`
    });
  }

  if (minutesStopped >= settings.longStopMinutes && !handled.has('long_stop')) {
    triggers.push({
      key: 'long_stop',
      type: 'long_stop',
      severity: 'medium',
      question: `You have been stopped for ${Math.round(minutesStopped)} minutes. Everything okay?`,
      message: `Teen has been stopped for more than ${settings.longStopMinutes} minutes.`
    });
  }

  if (settings.checkRiskZones) {
    const zone = findNearbyIncidentZone(location, incidentZones);
    if (zone && !handled.has(`risk_zone:${zone.id}`)) {
      triggers.push({
        key: `risk_zone:${zone.id}`,
        type: 'risk_zone',
        severity: 'low',
        question: `This area has recent ${ZONE_LABELS[zone.type]} reports. Continue or reroute?`,
        message: `Teen entered ${zone.name}.`,
        zone
      });
    }
  }

  const eta = remainingMinutes(location, routePoints, durationMinutes);
  const expected = context.expectedRemainingMinutes;
  if (
    typeof expected === 'number' &&
    eta - expected >= settings.etaDelayMinutes &&
    !handled.has('late_arrival')
  ) {
    triggers.push({
      key: 'late_arrival',
      type: 'late_arrival',
      severity: 'medium',
      question: 'Your ETA changed a lot. Still okay?',
      message: `ETA slipped by ${Math.round(eta - expected)} minutes.`
    });
  }

  return triggers;
}

function escalationMessage(checkin) {
  switch (checkin.type) {
    case 'route_deviation':
      return 'Teen left the planned route and did not answer the safety check.';
    case 'long_stop':
      return 'Teen stopped for several minutes and did not answer the safety check.';
    case 'risk_zone':
      return 'Teen entered a recent incident zone and did not answer the safety check.';
    case 'late_arrival':
      return 'Teen is running far behind ETA and did not answer the safety check.';
    default:
      return 'Teen did not answer the safety check.';
  }
}

const escapeHtml = (value) => String(value).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const allPoints = planned.flatMap((r) => r.points).concat(INCIDENT_ZONES.map((z) => [z.lat, z.lng]));
const bounds = allPoints.reduce(
  (acc, p) => ({
    minLat: Math.min(acc.minLat, p[0]),
    maxLat: Math.max(acc.maxLat, p[0]),
    minLng: Math.min(acc.minLng, p[1]),
    maxLng: Math.max(acc.maxLng, p[1])
  }),
  { minLat: 90, maxLat: -90, minLng: 180, maxLng: -180 }
);

const PAD = 0.004;
const view = {
  minLat: bounds.minLat - PAD,
  maxLat: bounds.maxLat + PAD,
  minLng: bounds.minLng - PAD * 1.4,
  maxLng: bounds.maxLng + PAD * 1.4
};

const WIDTH = 320;
const HEIGHT = 300;
const projectX = (lng) => ((lng - view.minLng) / (view.maxLng - view.minLng)) * WIDTH;
const projectY = (lat) => HEIGHT - ((lat - view.minLat) / (view.maxLat - view.minLat)) * HEIGHT;
const metersToPx = (meters) => (meters / haversineMeters([view.minLat, view.minLng], [view.minLat, view.maxLng])) * WIDTH;
const toPolyline = (points) => points.map((p) => projectX(p[1]).toFixed(1) + ',' + projectY(p[0]).toFixed(1)).join(' ');

function mapMarkup(options) {
  const routes = options.routes || [];
  const activeId = options.activeRouteId;
  const zoneShapes = INCIDENT_ZONES.map(
    (zone) =>
      `<circle cx="${projectX(zone.lng).toFixed(1)}" cy="${projectY(zone.lat).toFixed(1)}" r="${metersToPx(zone.radiusMeters).toFixed(1)}" fill="${ZONE_COLORS[zone.type]}" fill-opacity="0.16" stroke="${ZONE_COLORS[zone.type]}" stroke-width="0.6"><title>${escapeHtml(zone.name)} - severity ${zone.severity}, ${zone.recencyDays} days ago</title></circle>`
  ).join('');

  const placeShapes = SAFE_PLACES.map(
    (place) =>
      `<circle cx="${projectX(place.lng).toFixed(1)}" cy="${projectY(place.lat).toFixed(1)}" r="3.2" fill="#0ea5e9" stroke="#fff" stroke-width="1.2"><title>${escapeHtml(place.name)}</title></circle>` +
      `<text x="${(projectX(place.lng) + 5).toFixed(1)}" y="${(projectY(place.lat) + 2.5).toFixed(1)}">${escapeHtml(place.name)}</text>`
  ).join('');

  const routeShapes = routes
    .map((route) => {
      const isActive = !activeId || route.routeId === activeId;
      return `<polyline class="route-line" points="${toPolyline(route.points)}" stroke="${ROUTE_COLORS[route.label] || '#2563eb'}" stroke-width="${isActive ? 3.4 : 1.8}" opacity="${isActive ? 0.95 : 0.35}" />`;
    })
    .join('');

  const trail =
    options.trail && options.trail.length > 1
      ? `<polyline class="trail-line" points="${toPolyline(options.trail)}" />`
      : '';

  const teen = options.teenLocation
    ? `<circle class="teen-dot" cx="${projectX(options.teenLocation[1]).toFixed(1)}" cy="${projectY(options.teenLocation[0]).toFixed(1)}" r="5" />`
    : '';

  return `
    <div class="map-shell">
      <svg class="svg-map" viewBox="0 0 ${WIDTH} ${HEIGHT}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Redmond safety map">
        ${zoneShapes}${routeShapes}${trail}${placeShapes}${teen}
      </svg>
    </div>
    <div class="map-legend">
      <span><i class="swatch" style="background:#f59e0b"></i>property crime</span>
      <span><i class="swatch" style="background:#ef4444"></i>violent crime</span>
      <span><i class="swatch" style="background:#8b5cf6"></i>collision</span>
      <span><i class="swatch" style="background:#3b82f6"></i>low light</span>
      <span><i class="swatch" style="background:#14b8a6"></i>community</span>
    </div>`;
}

  const trip = state.trip;
  const time = new Date(alert.createdAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const nav = trip && trip.location ? 'https://www.google.com/maps/dir/?api=1&destination=' + trip.location[0] + ',' + trip.location[1] : '#';
  return `
    <div class="alert-card severity-${alert.severity}">
      <div class="alert-head"><span class="alert-title">${ALERT_TITLES[alert.type] || 'Safety alert'}</span><span class="alert-time">${time}</span></div>
      <p class="alert-message">${escapeHtml(alert.message)}</p>
      ${trip ? `<p class="alert-meta">Trip: ${escapeHtml(trip.origin.name)} to ${escapeHtml(trip.destination.name)} &middot; route ${escapeHtml(trip.route.label)}</p>` : ''}
      <div class="alert-actions">
        <a class="btn btn-ghost" href="tel:${DEMO_USERS.teen.phone.replace(/[^0-9+]/g, '')}">Call teen</a>
        <a class="btn btn-ghost" href="${nav}" target="_blank" rel="noreferrer">Navigate there</a>
        <a class="btn btn-danger" href="tel:911">Call 911</a>
      </div>
      ${alert.status === 'pending' ? `<button type="button" class="btn btn-quiet" data-action="ack" data-alert="${alert.id}">Acknowledge</button>` : `<span class="status-chip">${alert.status}</span>`}
    </div>`;
}

function demoBar() {
  const active = state.trip && state.trip.status !== 'completed';
  return `
    <footer class="demo-bar">
      <span class="demo-label">Demo controls</span>
      <div class="demo-buttons">
        <button type="button" data-action="stop" ${active ? '' : 'disabled'}>${state.sim.stopped ? 'Resume walking' : 'Stop here'}</button>
        <button type="button" data-action="detour" ${active ? '' : 'disabled'}>${state.sim.offRoute ? 'Return to route' : 'Take a detour'}</button>
        <button type="button" data-action="reset">Reset demo</button>
      </div>
    </footer>`;
}

function render() {
  const teenView = state.trip && state.trip.status !== 'completed' ? activeTripScreen() : state.screen === 'routes' ? routesScreen() : destinationScreen();
  root.innerHTML = `
    <div class="app">
      <header class="app-bar">
        <div class="brand">
          <span class="brand-mark">GR</span>
          <div><strong>GuardianRoute</strong><span class="tagline">From passive tracking to proactive protection</span></div>
        </div>
        <div class="mode-toggle">
          <button type="button" class="${state.mode === 'teen' ? 'active' : ''}" data-action="mode" data-mode="teen">Teen</button>
          <button type="button" class="${state.mode === 'parent' ? 'active' : ''}" data-action="mode" data-mode="parent">Parent${state.mode !== 'parent' && state.alerts.some((a) => a.status === 'pending') ? '<span class="dot"></span>' : ''}</button>
        </div>
      </header>
      <main>${state.mode === 'teen' ? teenView : parentScreen()}</main>
      ${demoBar()}
      ${state.mode === 'teen' ? checkinMarkup() : ''}
    </div>`;
}

function startTrip(route) {
  const now = Date.now();
  state.trip = {
    id: createId('trip'),
    teenUserId: DEMO_USERS.teen.id,
    parentUserId: DEMO_USERS.parent.id,
    origin: route.origin,
    destination: route.destination,
    route,
    status: 'active',
    startedAt: now,
    lastSeenAt: now,
    location: route.points[0],
    etaMinutes: route.durationMinutes,
    offRouteMeters: 0,
    handledKeys: []
  };
  state.trail = [route.points[0]];
  state.alerts = [];
  state.checkin = null;
  state.sim = { running: true, index: 0, offRoute: false, stopped: false, minutesStopped: 0 };
}

function raiseAlert(alert) {
  state.alerts.unshift({ id: createId('alert'), status: 'pending', createdAt: Date.now(), ...alert });
}

function respond(response) {
  const checkin = state.checkin;
  if (!checkin || checkin.status !== 'waiting') return;
  if (response === 'need_help') {
    checkin.status = 'teen_needs_help';
    raiseAlert({ type: 'sos', severity: 'high', message: 'Teen asked for help during a safety check.' });
    return;
  }
  checkin.status = 'teen_ok';
  state.alerts = state.alerts.map((alert) => (alert.status === 'pending' ? { ...alert, status: 'resolved' } : alert));
  if (response === 'reroute') {
    state.sim.offRoute = false;
    state.sim.stopped = false;
    state.sim.minutesStopped = 0;
    state.sim.index = nearestIndex(state.trip.location, state.trip.route.points);
  }
}

function pushLocation(location) {
  const trip = state.trip;
  trip.location = location;
  trip.lastSeenAt = Date.now();
  trip.etaMinutes = remainingMinutes(location, trip.route.points, trip.route.durationMinutes);
  trip.offRouteMeters = Math.round(distanceFromRoute(location, trip.route.points));
  state.trail = state.trail.concat([location]).slice(-400);

  if (state.checkin && state.checkin.status === 'waiting') return;

  const triggers = evaluateTrip({
    location,
    routePoints: trip.route.points,
    durationMinutes: trip.route.durationMinutes,
    minutesStopped: state.sim.minutesStopped,
    incidentZones: INCIDENT_ZONES,
    settings: state.settings,
    handledKeys: trip.handledKeys
  });

  if (triggers.length === 0) return;
  const trigger = triggers[0];
  trip.handledKeys.push(trigger.key);
  state.checkin = {
    id: createId('checkin'),
    key: trigger.key,
    type: trigger.type,
    reason: trigger.message,
    question: trigger.question,
    status: 'waiting',
    createdAt: Date.now(),
    expiresAt: Date.now() + state.settings.checkinTimeoutSeconds * 1000
  };
}

function tick() {
  const trip = state.trip;
  if (trip && trip.status !== 'completed') {
    if (state.checkin && state.checkin.status === 'waiting' && Date.now() >= state.checkin.expiresAt) {
      state.checkin.status = 'expired';
      raiseAlert({ type: 'missed_checkin', severity: 'high', message: escalationMessage(state.checkin) });
    } else if (state.sim.running) {
      if (state.sim.stopped) {
        state.sim.minutesStopped += 1;
        pushLocation(trip.location);
      } else {
        const path = state.sim.offRoute ? state.detourPoints : trip.route.points;
        state.sim.index = Math.min(state.sim.index + 1, path.length - 1);
        state.sim.minutesStopped = 0;
        pushLocation(path[state.sim.index]);
        if (!state.sim.offRoute && state.sim.index === path.length - 1) {
          trip.status = 'completed';
          state.sim.running = false;
        }
      }
    }
  }
  render();
}

root.addEventListener('click', (event) => {
  const target = event.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;

  if (action === 'mode') state.mode = target.dataset.mode;
  if (action === 'pick') state.screen = 'routes';
  if (action === 'back') {
    state.screen = 'destination';
    state.selectedRouteId = null;
  }
  if (action === 'select') state.selectedRouteId = target.dataset.route;
  if (action === 'start') {
    const route = planned.find((r) => r.routeId === state.selectedRouteId);
    if (route) startTrip(route);
  }
  if (action === 'arrived') {
    state.trip.status = 'completed';
    state.sim.running = false;
    state.checkin = null;
  }
  if (action === 'back-on-route') {
    state.sim.offRoute = false;
    state.sim.stopped = false;
    state.sim.minutesStopped = 0;
    state.sim.index = nearestIndex(state.trip.location, state.trip.route.points);
  }
  if (action === 'sos') raiseAlert({ type: 'sos', severity: 'high', message: 'Teen pressed the help button.' });
  if (action === 'respond') respond(target.dataset.response);
  if (action === 'ack') {
    state.alerts = state.alerts.map((alert) => (alert.id === target.dataset.alert ? { ...alert, status: 'acknowledged' } : alert));
  }
  if (action === 'stop') {
    state.sim.stopped = !state.sim.stopped;
    state.sim.minutesStopped = 0;
  }
  if (action === 'detour') {
    state.sim.offRoute = !state.sim.offRoute;
    state.sim.stopped = false;
    state.sim.minutesStopped = 0;
    if (state.sim.offRoute) {
      state.detourPoints = detourFrom(state.trip.location);
      state.sim.index = 0;
    } else {
      state.sim.index = nearestIndex(state.trip.location, state.trip.route.points);
    }
  }
  if (action === 'reset') {
    state.trip = null;
    state.checkin = null;
    state.alerts = [];
    state.trail = [];
    state.screen = 'destination';
    state.selectedRouteId = null;
    state.sim = { running: false, index: 0, offRoute: false, stopped: false, minutesStopped: 0 };
  }
  render();
});

root.addEventListener('change', (event) => {
  const target = event.target.closest('[data-action="toggle"]');
  if (!target) return;
  const key = target.dataset.key;
  if (key === 'checkRiskZones') state.settings.checkRiskZones = !state.settings.checkRiskZones;
  else state.settings[key] = state.settings[key] > 0 ? 0 : DEFAULT_SETTINGS[key];
  render();
});

render();
setInterval(tick, 1000);

</script>
</body>
</html>
